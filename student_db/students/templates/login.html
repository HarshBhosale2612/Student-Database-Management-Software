<!DOCTYPE html>
<html>
    <head>
        <style>
                body {
                margin:0;
                font-family: Arial;
                background: linear-gradient(135deg,#1f1c2c,#928dab);
}

                .card {
                width: 350px;
                margin: 120px auto;
                padding: 30px;
                border-radius: 15px;
                background: rgba(255,255,255,0.1);
                backdrop-filter: blur(10px);
                color: white;
                text-align: center;
                box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            }

                input, button {
                    width: 100%;
                    padding: 12px;
                    margin: 10px 0;
                    border-radius: 8px;
                    border: none;
                }

                input {
                    background: rgba(255,255,255,0.2);
                    color: white;
                }

                button {
                    background: linear-gradient(45deg,#ff6a00,#ee0979);
                    color: white;
                }

                a { color: #ffd86f; }
            </style>
        </head>

        <body>
            <div class="card">
                <h2>Login</h2>
                <form method="POST">
                    {% csrf_token %}
                    <input name="username" placeholder="Username">
                    <input type="password" name="password" placeholder="Password">
                    <button>Login</button>
                </form>
            <p><a href="/signup/">Create Account</a></p>
            </div>
</body>
</html>
