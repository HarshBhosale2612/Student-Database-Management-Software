<!DOCTYPE html>
<html>
<head>
<style>
body {
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    font-family: Arial;
}
.card {
    width: 350px;
    margin: 120px auto;
    padding: 30px;
    border-radius: 15px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    color: white;
    text-align: center;
}
input, button {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
}
input {
    background: rgba(255,255,255,0.2);
    color: white;
}
button {
    background: linear-gradient(45deg,#00c6ff,#0072ff);
}
</style>
</head>

<body>
<div class="card">
<h2>Signup</h2>
<form method="POST">
{% csrf_token %}
<input name="username" placeholder="Username">
<input type="password" name="password" placeholder="Password">
<button>Signup</button>
</form>
</div>
</body>
</html>
